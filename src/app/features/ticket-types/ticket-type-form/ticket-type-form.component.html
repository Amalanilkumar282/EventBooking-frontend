<div class="form-container">
  @if (isLoading()) {
    <div class="loading-container">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  } @else {
    <div class="form-header">
      <button class="back-button" routerLink="/ticket-types">
        Back to Ticket Types
      </button>
      <h1>{{ ticketTypeId() ? 'Edit Ticket Type' : 'Create Ticket Type' }}</h1>
    </div>

    @if (errorMessage()) {
      <div class="error-message">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="ticket-type-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="eventId">Event *</label>
          <select id="eventId" formControlName="eventId">
            <option value="">Select an event</option>
            @for (e of events(); track e.id) {
              <option [value]="e.id">{{ e.name }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="name">Name *</label>
          <input id="name" type="text" formControlName="name" />
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" formControlName="description"></textarea>
        </div>

        <div class="form-group">
          <label for="price">Price *</label>
          <input id="price" type="number" formControlName="price" />
        </div>

        <div class="form-group">
          <label for="quantity">Quantity *</label>
          <input id="quantity" type="number" formControlName="quantity" />
        </div>

        @if (ticketTypeId()) {
          <div class="form-group">
            <label for="isActive">Active</label>
            <input id="isActive" type="checkbox" formControlName="isActive" />
          </div>
        }
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" routerLink="/ticket-types">Cancel</button>
        <button type="submit" class="btn btn-primary">{{ ticketTypeId() ? 'Update' : 'Create' }}</button>
      </div>
    </form>
  }
</div>
